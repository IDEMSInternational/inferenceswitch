name: Release

# Two ways in:
#   * publishing a GitHub Release -> PyPI. The release is the trigger, so the
#     tag, the release notes and the upload are one action rather than three
#     that can drift apart.
#   * manual dispatch -> TestPyPI, for rehearsing a release without burning a
#     version number. PyPI refuses to replace an existing file, so a botched
#     real upload cannot be corrected in place -- only yanked and re-numbered.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      target:
        description: "Where to upload"
        required: true
        default: testpypi
        type: choice
        options: [testpypi]

jobs:
  build:
    name: Build sdist and wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The version lives in pyproject.toml and the tag is typed by hand, so
      # they can disagree. Catch that here rather than after an unfixable
      # upload: publishing 0.1.0 from a v0.2.0 tag is not correctable, since
      # PyPI will not let that filename be reused even after a yank.
      - name: Tag and pyproject version agree
        if: github.event_name == 'release'
        run: |
          python - <<'PY'
          import os, sys, tomllib
          tag = os.environ["TAG"].removeprefix("v")
          declared = tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]
          if tag != declared:
              sys.exit(f"tag {tag!r} != pyproject version {declared!r}")
          print(f"version {declared} matches tag")
          PY
        env:
          TAG: ${{ github.event.release.tag_name }}

      - name: Build
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          twine check --strict dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  pypi:
    name: Publish to PyPI
    needs: build
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    # Named environment so the upload can be gated on a required reviewer in
    # repo settings, and so PyPI's trusted publisher can be scoped to it.
    environment:
      name: pypi
      url: https://pypi.org/p/inferenceswitch
    permissions:
      # The whole authentication story. Trusted Publishing mints a short-lived
      # OIDC token for this specific workflow in this specific repo, so there
      # is no long-lived API token in repo secrets to leak or rotate.
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  testpypi:
    name: Publish to TestPyPI
    needs: build
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/inferenceswitch
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          # A rehearsal should not fail because the same version was rehearsed
          # before. Never set this on the real PyPI job.
          skip-existing: true
