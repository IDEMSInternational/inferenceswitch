name: Sweep model cards

# Weekly: refresh what a machine can know about the model cards (OpenRouter
# route prices, benchmark scores, the chart and table the README carries) and report what a person should look at (new
# open models, other routes whose price OpenRouter lists differently, rung
# suggestions). No keys and no model calls: it reads two public catalogs.
# See tools/sweep.py and "Keeping cards current" in docs/model-cards.md.
#
# Needs "Allow GitHub Actions to create and approve pull requests" switched on
# in the repository's Actions settings.

on:
  schedule:
    - cron: "17 6 * * 1"   # Mondays, 06:17 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  sweep:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Refresh route prices and benchmark scores
        run: python tools/sweep.py update | tee changes.txt

      - name: Report what needs a person
        run: python tools/sweep.py report --out report.md --findings findings.txt

      - name: Show the report
        run: |
          cat report.md >> "$GITHUB_STEP_SUMMARY"
          echo "Refreshed:" >> "$GITHUB_STEP_SUMMARY"
          cat changes.txt >> "$GITHUB_STEP_SUMMARY"

      # The refreshed file must still load and pass the card tests before anyone
      # is asked to review it.
      - name: Test the refreshed cards
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pytest -q

      - name: Open a pull request when the data changed
        run: |
          if git diff --quiet -- inferenceswitch/model_cards.json docs/model-cards-chart.svg README.md; then
            echo "Cards unchanged."
            exit 0
          fi
          if [ -n "$(gh pr list --state open --search 'head:sweep-' --json number --jq '.[].number')" ]; then
            echo "A sweep PR is already open; leaving it for review."
            exit 0
          fi
          branch="sweep-$(date -u +%F)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add inferenceswitch/model_cards.json docs/model-cards-chart.svg README.md
          git commit -m "cards: weekly sweep, $(date -u +%F)" -m "$(cat changes.txt)"
          git push -u origin "$branch"
          { echo "Prices and scores refreshed, and the README chart and table redrawn, by \`tools/sweep.py update\`. Rungs, notes and other providers' prices are untouched."; echo; cat changes.txt; echo; cat report.md; } > pr-body.md
          gh pr create --title "cards: weekly sweep, $(date -u +%F)" --body-file pr-body.md

      # One standing issue for the items a machine cannot decide, refreshed each
      # week rather than a new one every Monday. Close it when it is dealt with.
      - name: Keep one issue for what needs a look
        run: |
          count="$(cat findings.txt)"
          existing="$(gh issue list --state open --search 'Model card sweep in:title' --json number,title --jq '.[] | select(.title | startswith("Model card sweep")) | .number' | head -n1)"
          if [ "$count" = "0" ]; then
            echo "Nothing for a person to look at."
            exit 0
          fi
          if [ -n "$existing" ]; then
            gh issue edit "$existing" --body-file report.md
          else
            gh issue create --title "Model card sweep: $count items to look at" --body-file report.md
          fi
